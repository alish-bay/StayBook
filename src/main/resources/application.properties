spring.application.name=StayBook
server.port=8080

# ===================================================================
# 1. User Database (staybook_user_db)
# ===================================================================
spring.datasource.user.url=${USER_DB_URL:jdbc:postgresql://localhost:5432/staybook_user_db}
spring.datasource.user.username=${DB_USERNAME:postgres}
spring.datasource.user.password=${DB_PASSWORD:postgres}
spring.datasource.user.driver-class-name=org.postgresql.Driver

# ===================================================================
# 2. Room Database (staybook_room_db)
# ===================================================================
spring.datasource.room.url=${ROOM_DB_URL:jdbc:postgresql://localhost:5432/staybook_room_db}
spring.datasource.room.username=${DB_USERNAME:postgres}
spring.datasource.room.password=${DB_PASSWORD:postgres}
spring.datasource.room.driver-class-name=org.postgresql.Driver

# ===================================================================
# 3. Booking Database (staybook_booking_db)
# ===================================================================
spring.datasource.booking.url=${BOOKING_DB_URL:jdbc:postgresql://localhost:5432/staybook_booking_db}
spring.datasource.booking.username=${DB_USERNAME:postgres}
spring.datasource.booking.password=${DB_PASSWORD:postgres}
spring.datasource.booking.driver-class-name=org.postgresql.Driver

# ===================================================================
# Common JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# Liquibase Multi-Database Migration Configuration
# ===================================================================
# Disable standard single-datasource Spring Boot auto-configuration
spring.liquibase.enabled=false
# Toggle for StayBook multi-database Liquibase runners
staybook.liquibase.enabled=${LIQUIBASE_ENABLED:true}
